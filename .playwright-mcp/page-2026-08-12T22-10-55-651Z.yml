    - main [ref=f196e75]:
      - article [ref=f196e77]:
        - img "An ice hockey player, holding his hand to his chin to indicate \"thinking\"" [ref=f196e79]
        - heading "Frequently Asked Questions (FAQs)" [level=1] [ref=f196e81]
        - generic [ref=f196e82]:
          - paragraph [ref=f196e84]:
            - text: Thank you for your interest in joining the ARL! We strive to make the registration process as easy as possible. To that end, this page will answer some of the more common questions we’ve received over the years. If you feel something is missing or if you still have outstanding questions, please
            - link "reach out to us (opens in a new tab)" [ref=f196e85] [cursor=pointer]:
              - /url: https://staging.rookiehockey.ca/registration
              - text: reach out to us
            - text: .
          - paragraph [ref=f196e86]: For the purpose of this FAQ, the ARL – Adult Recreational Hockey League – may be referred to interchangeable as “we”, “us”, or the “ARL” with owned assets referred to as “our(s)”.
          - separator [ref=f196e87]
          - heading "How do I register to play in the ARL?" [level=3] [ref=f196e88]
          - paragraph [ref=f196e89]:
            - text: Registration is all completed digitally via the ARL website. The registration landing page can be found
            - link "here" [ref=f196e90] [cursor=pointer]:
              - /url: https://staging.rookiehockey.ca/register
            - text: .
          - heading "When can I register?" [level=3] [ref=f196e91]
          - paragraph [ref=f196e92]:
            - text: The ARL has 2 season; Spring/Summer and Fall/Winter. Typically, registration opens 2 months prior to the start of the season. This means the Summer season opens in February, while the Winter Season opens in July. An announcement will be made on the
            - link "News page (opens in a new tab)" [ref=f196e93] [cursor=pointer]:
              - /url: /news
              - text: News page
            - text: the day registration has been opened.
          - heading "What payment options are available?" [level=3] [ref=f196e94]
          - paragraph [ref=f196e95]:
            - text: At the time of writing, the ARL provides the option of making payments via Debit*, Credit Card or Interac e-Transfer.
            - emphasis [ref=f196e96]: "*The Debit card must display a Visa or MasterCard logo. Alternatively, a PayPal account provides the ability to link a bank account and make payments that way."
          - heading "Is my registration transaction secure?" [level=3] [ref=f196e97]
          - paragraph [ref=f196e98]:
            - text: The ARL makes every practical attempt to safe-guard transactions performed on our website. This includes (but is not limited to) utilizing HTTPS (TLS 1.1, 1.2, 1.3), HSTS, and the latest security patches. Qualsys, a trusted SSL testing suite, gives us
            - link "an A+ rating (opens in a new tab)" [ref=f196e99] [cursor=pointer]:
              - /url: https://www.ssllabs.com/ssltest/analyze.html?d=staging.rookiehockey.ca&hideResults=on
              - text: an A+ rating
            - text: "! ("
            - emphasis [ref=f196e100]: "as of: 8/8/2026)"
          - heading "Does the ARL store my credit card number?" [level=3] [ref=f196e101]
          - paragraph [ref=f196e102]:
            - text: No. Payments made via credit card are processed via external, 3rd-party vendors. At the time of writing, these vendors are
            - link "Stripe (opens in a new tab)" [ref=f196e103] [cursor=pointer]:
              - /url: https://stripe.com/ca
              - text: Stripe
            - text: and
            - link "PayPal (opens in a new tab)" [ref=f196e104] [cursor=pointer]:
              - /url: https://www.paypal.com/ca/
              - text: PayPal
            - text: ; 2 highly reputable online payment gateways. For more information on how your information may be stored, please see their respective websites.
          - heading "How does the Installments (Split-Payment) option work?" [level=3] [ref=f196e105]
          - paragraph [ref=f196e106]:
            - text: If you elect to use the split-payment option, the first half of the registration fee will be due at the time of sign-up, with the second half due in 30 days.If you paid the first installment with a credit card (Stripe/PayPal), your card will automatically be billed the second installment in 30 days. If the transaction fails, you will receive an email with a link to follow to make the payment.If you paid the first installment with e-Transfer, an invoice containing a link to make the second installment payment will be generated in 30 days and sent via email.Failure to complete the second installment payment within a timely manner (at the sole discretion of the ARL) may result in the rejection of your registration as well as monetary loss as outlined in the
            - link "Refund Policy (opens in a new tab)" [ref=f196e107] [cursor=pointer]:
              - /url: /legal#refund
              - text: Refund Policy
            - text: .
          - heading "What is the “Processing Fee” on my invoice?" [level=3] [ref=f196e108]
          - paragraph [ref=f196e109]:
            - text: This fee could have easily been called a ‘convienience fee’ or similar. If you elected to pay by Stripe or PayPal, you will likely see this additional charge. Both Stripe and PayPal charge a 2.9% + $0.30 processing fee (
            - link "1" [ref=f196e110] [cursor=pointer]:
              - /url: https://stripe.com/ca/pricing
            - text: ","
            - link "2" [ref=f196e111] [cursor=pointer]:
              - /url: https://www.paypal.com/ca/webapps/mpp/paypal-fees
            - text: ) for all credit card transactions. In an act of transparency, we elected to show this charge clearly on checkout.
          - heading "How can I avoid the “Processing Fee”?" [level=3] [ref=f196e112]
          - paragraph [ref=f196e113]: This fee only applies to Stripe and PayPal. There is no additional fee for payments made by e-Transfers, although your banking institution may charge their own fee for the use of e-Transfer depending on your account type. Please refer to your bank for charges or fees they may charge
          - heading "How can I check my current/previous registrations?" [level=3] [ref=f196e114]
          - paragraph [ref=f196e115]:
            - text: When you register to play in the ARL, you are given the option to also sign-up for an ARL account (“My ARL Account”). This is highly recommended as it ties all your interactions with us to an easy to manage portal. To access your account, please go to
            - link "My Account (opens in a new tab)" [ref=f196e116] [cursor=pointer]:
              - /url: /account
              - text: My Account
            - text: .
          - heading "I’m not sure if my registration went through. Can you confirm for me?" [level=3] [ref=f196e117]
          - paragraph [ref=f196e118]:
            - text: If you received a “Your registration is accepted” email from the ARL, your registration was more than likely processed without issue. If you would still like to confirm, you can see your current registration status on your
            - link "My Account (opens in a new tab)" [ref=f196e119] [cursor=pointer]:
              - /url: /account
              - text: My Account
            - text: page (provided you elected to sign-up for an account at registration). Otherwise, please
            - link "contact us (opens in a new tab)" [ref=f196e120] [cursor=pointer]:
              - /url: /arl-league-info/contact-us
              - text: contact us
            - text: to confirm.
          - heading [level=3] [ref=f196e121]:
            - text: Where can I check my current installments status?
            - emphasis [ref=f196e122]: or
            - text: Where can I make an installment payment?
          - paragraph [ref=f196e123]:
            - text: Installment status is available on the
            - link "My Account (opens in a new tab)" [ref=f196e124] [cursor=pointer]:
              - /url: /account
              - text: My Account
            - text: page. If you did not register for an ARL account, please
            - link "contact us (opens in a new tab)" [ref=f196e125] [cursor=pointer]:
              - /url: /arl-league-info/contact-us
              - text: contact us
            - text: to obtain this information.
          - heading "I would like to pay for my second installment before the automatic 30-day period." [level=3] [ref=f196e126]
          - paragraph [ref=f196e127]:
            - text: If you would like to pay your second installment early and you have an ARL account, you may do so on your
            - link "My Account (opens in a new tab)" [ref=f196e128] [cursor=pointer]:
              - /url: /account
              - text: My Account
            - text: page under Installments. Otherwise, please wait for the automated process.
          - heading "I need a copy of my invoice/receipt." [level=3] [ref=f196e129]
          - paragraph [ref=f196e130]:
            - text: If you have an ARL account, this can be found on the My Account page. A copy also should have been emailed to you. If not, please
            - link "contact us (opens in a new tab)" [ref=f196e131] [cursor=pointer]:
              - /url: /arl-league-info/contact-us
              - text: contact us
            - text: to obtain a copy.
          - heading "My previous registrations aren’t listed on the “My ARL Account” page." [level=3] [ref=f196e132]
          - paragraph [ref=f196e133]:
            - text: This will likely occur if you were not signed in to your account at the time you registered. Please use the
            - link "Contact Us (opens in a new tab)" [ref=f196e134] [cursor=pointer]:
              - /url: /arl-league-info/contact-us
              - text: Contact Us
            - text: form and report a “Website Error”. We will manually link your past transactions to your account.
          - heading "My registration is showing an “On-Hold” status. What does this mean?" [level=3] [ref=f196e135]
          - paragraph [ref=f196e136]: If your registration is showing as On-Hold, you likely elected to use e-Transfer as your payment method. If you have already sent your payment, please allow up to a week for the status to change as takes a bit to manually deposit and action the registration
          - heading "How can I check if the ARL website is having issues?" [level=3] [ref=f196e137]
          - paragraph [ref=f196e138]:
            - text: A status page for the ARL website is available at
            - link "https://status.lusk.tech" [ref=f196e139] [cursor=pointer]:
              - /url: https://status.lusk.tech/
          - heading "Where can I find video of ARL games?" [level=3] [ref=f196e140]
          - paragraph [ref=f196e141]:
            - text: The Wave facilities partner with
            - link "LiveBarn" [ref=f196e142] [cursor=pointer]:
              - /url: https://www.livebarn.com/
            - text: to deliver video streams live and on demand. There is a subscription cost associated. The ARL is not affiliated with LiveBarn and this message should not be taken as an endorsement.
          - heading "I’ve read through this page but my question hasn’t been answered" [level=3] [ref=f196e143]
          - paragraph [ref=f196e144]:
            - text: Please head over to the
            - link "Contact Us (opens in a new tab)" [ref=f196e145] [cursor=pointer]:
              - /url: /arl-league-info/contact-us
              - text: Contact Us
            - text: page and send us a message.
          - heading "Registration & Roster Changes" [level=2] [ref=f196e146]
          - paragraph [ref=f196e147]:
            - text: A series of questions and answers related to the updated
            - link "Winter 2026-27 Roster building process" [ref=f196e148] [cursor=pointer]:
              - /url: https://staging.rookiehockey.ca/2026/08/winter-season-registration-update
            - text: . We may append or modify this list at any time. The proper verbiage to use can be difficult, so please
            - link "reach out" [ref=f196e149] [cursor=pointer]:
              - /url: https://staging.rookiehockey.ca/arl-league-info/contact-us
            - text: to us if anything remains confusing or raises concern.
          - heading "So I can’t sign up a whole team? Isn’t that the point of this league?" [level=3] [ref=f196e150]
          - paragraph [ref=f196e151]: We completely understand that this new format will not be the right fit for everyone. The ARL’s primary focus is and always has been providing a balanced, beginner-friendly, and social environment. If keeping a full, pre-made roster together is your team’s top priority, we completely respect that, but there are other leagues in the area better suited for that style of play. We want the best experience for everyone, even if that means it won’t be as part of the ARL. We also want to remind everyone that individual players from those teams are always welcome to register on their own if they would like to stay in the ARL.
          - heading "It feels like no thought was put into this! I am leaving the league." [level=3] [ref=f196e152]
          - paragraph [ref=f196e153]: We know this is a frustrating shift for established teams, and it might feel sudden. However, this decision was not made lightly nor abruptly. We spent a significant amount of time reviewing the direction the league was heading, specifically the growing skill gaps and the recent hostility toward balancing trades. We had to make a difficult choice between preserving pre-made rosters or protecting the welcoming, balanced spirit of the league. We chose the latter. If this means the ARL is no longer the right fit for you, we completely understand and wish you the best of luck elsewhere.
          - heading "I’m a captain. How can I get more information about this change?" [level=3] [ref=f196e154]
          - paragraph [ref=f196e155]: We are currently in the process of contacting captains one-on-one to discuss these updates, and we ask for your patience as we work through the list. We deeply appreciate the captains who are waiting for these details with a calm and constructive mindset, as maintaining a respectful dialogue is essential for anyone holding a leadership role in the ARL. Navigating disagreements respectfully off the rink matters, because that is the exact attitude we expect to see from our leaders on the ice.
          - heading "How many players can a captain request?" [level=3] [ref=f196e156]
          - paragraph [ref=f196e157]: Captains may submit a priority list of up to 7 players, including the goalie. Including the captain, this means a maximum of 8 players can be linked together on a 16-person roster.
          - heading "Isn’t it unfair to make captains choose only 7 players to keep from an established team?" [level=3] [ref=f196e158]
          - paragraph [ref=f196e159]: We know narrowing down a roster is a tough position for captains. We looked at the options between mandating total roster resets or following other league examples and only allow three linked players (a captain and two assistants). We felt that was too drastic. The seven-player limit was a deliberate choice to ensure larger family groups and core friends could still stick together. It is a compromise that lets you keep half your team intact while giving the league the room it needs to balance the divisions.
          - heading "Can a captain submit a full roster and just highlight the top 7?" [level=3] [ref=f196e160]
          - paragraph [ref=f196e161]: Yes, captains are welcome to submit a complete roster and highlight your top 7 priority players. To help keep the divisions balanced, the league will manage and fill the remaining spots on the team.
          - heading "What if a captain does not want to choose between their current teammates?" [level=3] [ref=f196e162]
          - paragraph [ref=f196e163]: Priority lists are entirely optional. If a captain does not want to be the one deciding who stays and who goes, there are two options available. They can simply register as a captain and let the league build the roster from scratch. Alternatively, they can give us a full team list without picking a top seven, and we will assign who returns and who gets placed elsewhere.
          - heading "What happens if a captain’s priority list does not include a goaltender?" [level=3] [ref=f196e164]
          - paragraph [ref=f196e165]: Every team needs someone between the pipes. The goalie counts toward the 8-player maximum. If a captain submits a priority list that does not include a goaltender, the league will randomly assign one to your roster from the unattached registration pool to ensure the team is ready for puck drop.
          - heading "Are my priority picks guaranteed to be on my team?" [level=3] [ref=f196e166]
          - paragraph [ref=f196e167]: Priority picks are honored unless they create a significant skill imbalance that would make the division unfair. The league reserves the right to review and adjust these lists if necessary.
          - heading "Is the goal to make half of the team randomized?" [level=3] [ref=f196e168]
          - paragraph [ref=f196e169]: The goal is, as always, that ARL remains a welcoming, social environment where divisions are fair and players have the opportunity to build new connections. We may not completely abolish the core of all current teams. The extent of any roster change is at the sole discretion of the ARL conveners.
          - heading "What if I register with a friend, will we be split up?" [level=3] [ref=f196e170]
          - paragraph [ref=f196e171]: No. If you register as a pair on your individual registration forms, we will make every effort to ensure you are kept together on the same roster. Your individual requests take precedence over a captain’s priority list.
          - heading "I plan on joining the league with a large family group. Will we be broken up?" [level=3] [ref=f196e172]
          - paragraph [ref=f196e173]: We do not make any guarantees. The best chance of being placed together is to create a team using the family members as the priority picks. The number of team spots are limited and returning teams will take priority of those spots.
          - heading "Can I request NOT to play with a specific person or team?" [level=3] [ref=f196e174]
          - paragraph [ref=f196e175]: Yes. We understand that personalities can sometimes clash on the ice. You can confidentially note on your individual registration form if there is a specific player or team you would strongly prefer not to be matched with.
          - heading "How does the league determine a player’s skill bracket?" [level=3] [ref=f196e176]
          - paragraph [ref=f196e177]: To keep divisions balanced, we rely on a combination of past season statistics, previous captain feedback, and evaluations from league conveners. If you are a new player, your initial skill level will be assessed based on your registration questionnaire.
          - heading "What happens to our custom-approved jerseys?" [level=3] [ref=f196e178]
          - paragraph [ref=f196e179]: Custom jerseys are a “nice-to-have” element and never a requirement; we have never recommended putting names on the back. Ideally, the team captain should retain ownership of the custom set to distribute to their newly formed roster. If individual players take their jerseys when moving teams, the league will provide a full or partial set of standard jerseys to ensure your new roster is fully outfitted.
          - heading "If we bought custom jerseys, are we immune to roster changes?" [level=3] [ref=f196e180]
          - paragraph [ref=f196e181]: No. Custom jerseys do not guarantee that a team will stay together. To maintain fair play and a welcoming environment, the ARL reserves the right to move players to keep divisions balanced, regardless of team uniform status.
          - heading "The Legal" [level=2] [ref=f196e182]
          - paragraph [ref=f196e183]:
            - text: This page is meant to be taken as a general reference only. Any statements on this page do not amend, override or otherwise nullify any information found on the
            - link "Privacy Policy and Legal (opens in a new tab)" [ref=f196e184] [cursor=pointer]:
              - /url: /legal
              - text: Privacy Policy and Legal
            - text: page.
          - paragraph [ref=f196e185]: Interac, Stripe, PayPal and Qualsys are trademarks of their respective owners.

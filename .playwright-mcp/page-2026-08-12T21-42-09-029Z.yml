        - generic [ref=f170e126]:
          - paragraph [ref=f170e127]: "Every player on every team here started exactly where you are: never having played an organized game of hockey. That's not the exception in this league. It's most of the room."
          - generic [ref=f170e128]:
            - generic [ref=f170e129]:
              - term [ref=f170e130]: Will I be the worst one out there?
              - definition [ref=f170e131]: Almost certainly not, and it wouldn't matter if you were. This is a co-ed beginner league by design — no tryouts, no cuts, and teams built to be even, not stacked.
            - generic [ref=f170e132]:
              - term [ref=f170e133]: What gear do I actually need?
              - definition [ref=f170e134]:
                - text: Less than you'd think, and you can rent most of it nearby before buying a single thing.
                - link "See the gear guide" [ref=f170e135] [cursor=pointer]:
                  - /url: https://staging.rookiehockey.ca/arl-league-info/equipment
                - text: .
            - generic [ref=f170e136]:
              - term [ref=f170e137]: What if I can't really skate yet?
              - definition [ref=f170e138]: Then you'll fit right in with half the room. Games are paced for people still finding their edges, not for anyone trying out for the NHL.

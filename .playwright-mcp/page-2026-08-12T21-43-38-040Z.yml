        - generic [ref=f179e169]:
          - paragraph [ref=f179e170]: "Every player on every team here started exactly where you are: never having played an organized game of hockey. That's not the exception in this league. It's most of the room."
          - generic [ref=f179e171]:
            - generic [ref=f179e172]:
              - term [ref=f179e173]: Will I be the worst one out there?
              - definition [ref=f179e174]: Almost certainly not, and it wouldn't matter if you were. This is a co-ed beginner league by design — no tryouts, no cuts, and teams built to be even, not stacked.
            - generic [ref=f179e175]:
              - term [ref=f179e176]: What gear do I actually need?
              - definition [ref=f179e177]:
                - text: Less than you'd think, and you can rent most of it nearby before buying a single thing.
                - link "See the gear guide" [ref=f179e178] [cursor=pointer]:
                  - /url: https://staging.rookiehockey.ca/arl-league-info/equipment
                - text: .
            - generic [ref=f179e179]:
              - term [ref=f179e180]: What if I can't really skate yet?
              - definition [ref=f179e181]: Then you'll fit right in with half the room. Games are paced for people still finding their edges, not for anyone trying out for the NHL.

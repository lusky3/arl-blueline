        - generic [ref=f156e167]:
          - paragraph [ref=f156e168]: "Every player on every team here started exactly where you are: never having played an organized game of hockey. That's not the exception in this league. It's most of the room."
          - generic [ref=f156e169]:
            - generic [ref=f156e170]:
              - term [ref=f156e171]: Will I be the worst one out there?
              - definition [ref=f156e172]: Almost certainly not, and it wouldn't matter if you were. This is a co-ed beginner league by design — no tryouts, no cuts, and teams built to be even, not stacked.
            - generic [ref=f156e173]:
              - term [ref=f156e174]: What gear do I actually need?
              - definition [ref=f156e175]:
                - text: Less than you'd think, and you can rent most of it nearby before buying a single thing.
                - link "See the gear guide" [ref=f156e176] [cursor=pointer]:
                  - /url: https://staging.rookiehockey.ca/arl-league-info/equipment
                - text: .
            - generic [ref=f156e177]:
              - term [ref=f156e178]: What if I can't really skate yet?
              - definition [ref=f156e179]: Then you'll fit right in with half the room. Games are paced for people still finding their edges, not for anyone trying out for the NHL.

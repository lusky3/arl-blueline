        - generic [ref=f136e128]:
          - paragraph [ref=f136e129]: "Every player on every team here started exactly where you are: never having played an organized game of hockey. That's not the exception in this league. It's most of the room."
          - generic [ref=f136e130]:
            - generic [ref=f136e131]:
              - term [ref=f136e132]: Will I be the worst one out there?
              - definition [ref=f136e133]: Almost certainly not, and it wouldn't matter if you were. This is a co-ed beginner league by design — no tryouts, no cuts, and teams built to be even, not stacked.
            - generic [ref=f136e134]:
              - term [ref=f136e135]: What gear do I actually need?
              - definition [ref=f136e136]:
                - text: Less than you'd think, and you can rent most of it nearby before buying a single thing.
                - link "See the gear guide" [ref=f136e137] [cursor=pointer]:
                  - /url: https://staging.rookiehockey.ca/arl-league-info/equipment
                - text: .
            - generic [ref=f136e138]:
              - term [ref=f136e139]: What if I can't really skate yet?
              - definition [ref=f136e140]: Then you'll fit right in with half the room. Games are paced for people still finding their edges, not for anyone trying out for the NHL.

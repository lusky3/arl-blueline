        - generic [ref=f147e122]:
          - paragraph [ref=f147e123]: "Every player on every team here started exactly where you are: never having played an organized game of hockey. That's not the exception in this league. It's most of the room."
          - generic [ref=f147e124]:
            - generic [ref=f147e125]:
              - term [ref=f147e126]: Will I be the worst one out there?
              - definition [ref=f147e127]: Almost certainly not, and it wouldn't matter if you were. This is a co-ed beginner league by design — no tryouts, no cuts, and teams built to be even, not stacked.
            - generic [ref=f147e128]:
              - term [ref=f147e129]: What gear do I actually need?
              - definition [ref=f147e130]:
                - text: Less than you'd think, and you can rent most of it nearby before buying a single thing.
                - link "See the gear guide" [ref=f147e131] [cursor=pointer]:
                  - /url: https://staging.rookiehockey.ca/arl-league-info/equipment
                - text: .
            - generic [ref=f147e132]:
              - term [ref=f147e133]: What if I can't really skate yet?
              - definition [ref=f147e134]: Then you'll fit right in with half the room. Games are paced for people still finding their edges, not for anyone trying out for the NHL.

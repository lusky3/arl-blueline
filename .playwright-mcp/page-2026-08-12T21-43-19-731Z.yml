        - generic [ref=f176e169]:
          - paragraph [ref=f176e170]: "Every player on every team here started exactly where you are: never having played an organized game of hockey. That's not the exception in this league. It's most of the room."
          - generic [ref=f176e171]:
            - generic [ref=f176e172]:
              - term [ref=f176e173]: Will I be the worst one out there?
              - definition [ref=f176e174]: Almost certainly not, and it wouldn't matter if you were. This is a co-ed beginner league by design — no tryouts, no cuts, and teams built to be even, not stacked.
            - generic [ref=f176e175]:
              - term [ref=f176e176]: What gear do I actually need?
              - definition [ref=f176e177]:
                - text: Less than you'd think, and you can rent most of it nearby before buying a single thing.
                - link "See the gear guide" [ref=f176e178] [cursor=pointer]:
                  - /url: https://staging.rookiehockey.ca/arl-league-info/equipment
                - text: .
            - generic [ref=f176e179]:
              - term [ref=f176e180]: What if I can't really skate yet?
              - definition [ref=f176e181]: Then you'll fit right in with half the room. Games are paced for people still finding their edges, not for anyone trying out for the NHL.

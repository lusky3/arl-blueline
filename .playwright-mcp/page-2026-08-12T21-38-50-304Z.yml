        - generic [ref=f161e165]:
          - paragraph [ref=f161e166]: "Every player on every team here started exactly where you are: never having played an organized game of hockey. That's not the exception in this league. It's most of the room."
          - generic [ref=f161e167]:
            - generic [ref=f161e168]:
              - term [ref=f161e169]: Will I be the worst one out there?
              - definition [ref=f161e170]: Almost certainly not, and it wouldn't matter if you were. This is a co-ed beginner league by design — no tryouts, no cuts, and teams built to be even, not stacked.
            - generic [ref=f161e171]:
              - term [ref=f161e172]: What gear do I actually need?
              - definition [ref=f161e173]:
                - text: Less than you'd think, and you can rent most of it nearby before buying a single thing.
                - link "See the gear guide" [ref=f161e174] [cursor=pointer]:
                  - /url: https://staging.rookiehockey.ca/arl-league-info/equipment
                - text: .
            - generic [ref=f161e175]:
              - term [ref=f161e176]: What if I can't really skate yet?
              - definition [ref=f161e177]: Then you'll fit right in with half the room. Games are paced for people still finding their edges, not for anyone trying out for the NHL.

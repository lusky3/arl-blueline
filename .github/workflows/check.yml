name: Check

# Runs the same gate `npm run check` runs locally: stylelint, eslint, the
# node:test suite for tools/, the contrast-rules.json/tokens.json guard,
# PHPUnit, and phpcs. Deliberately does NOT run `npm run check:oracle` --
# that requires an SSH-reachable staging host (see
# scripts/fetch-wp-core-oracle.sh) that CI has no access to, and
# WpCoreContractTest's oracle job skips gracefully with no
# BLUELINE_WP_CORE_INCLUDES_DIR configured.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: themes/blueline

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Run the gate
        run: npm run check

      # blueline-core's suite requires themes/blueline/tests/bootstrap.php for
      # its WordPress stubs (but not the theme's vendor/), so it runs from the
      # same checkout.
      - name: Install plugin PHP dependencies
        working-directory: plugins/blueline-core
        run: composer install --no-interaction --no-progress

      - name: Plugin tests
        working-directory: plugins/blueline-core
        run: composer test

      - name: Plugin lint
        working-directory: plugins/blueline-core
        run: composer lint

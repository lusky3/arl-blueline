name: Check

# Runs the same gate `npm run check` runs locally: stylelint, eslint, the
# node:test suite for tools/, the contrast-rules.json/tokens.json guard,
# PHPUnit, and phpcs. Deliberately does NOT run `npm run check:oracle` --
# that requires an SSH-reachable staging host (see
# scripts/fetch-wp-core-oracle.sh) that CI has no access to, and
# WpCoreContractTest's oracle job skips gracefully with no
# BLUELINE_WP_CORE_INCLUDES_DIR configured.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: nothing here writes to the repository, issues or packages.
permissions:
  contents: read

defaults:
  run:
    working-directory: themes/blueline

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Run the gate
        run: npm run check

      # blueline-core's suite requires themes/blueline/tests/bootstrap.php for
      # its WordPress stubs (but not the theme's vendor/), so it runs from the
      # same checkout.
      # composer.json and composer.lock must agree, and no locked dependency may
      # carry a published advisory (dev tooling only today; still worth a red build).
      - name: Validate the plugin's composer files
        working-directory: plugins/blueline-core
        run: composer validate --strict --no-interaction

      - name: Install plugin PHP dependencies
        working-directory: plugins/blueline-core
        run: composer install --no-interaction --no-progress

      - name: Audit plugin dependencies
        working-directory: plugins/blueline-core
        run: composer audit --locked --no-interaction

      - name: Plugin tests
        working-directory: plugins/blueline-core
        run: composer test

      # WordPress standard via plugins/blueline-core/phpcs.xml.dist (text domain,
      # global prefixes, minimum WordPress version).
      - name: Plugin lint
        working-directory: plugins/blueline-core
        run: composer lint

  # The plugin's release pipeline, exercised on every PR so a broken packager or
  # a drifting version is found here, not when a tag is pushed (release.yml runs
  # the same two scripts for real). Builds into a temp dir; publishes nothing.
  plugin-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      # Header Version == BLUELINE_CORE_VERSION == composer.json version (if any)
      # == README Stable tag (if any); composer require.php == Requires PHP.
      - name: Plugin version guard
        run: php scripts/release/plugin-guard.php

      - name: Lint the release and deploy scripts
        run: shellcheck scripts/release/package-plugin.sh scripts/release/test-plugin-release.sh scripts/deploy-plugin.sh

      # Builds the zip, asserts its exact content list, reproducibility, and that
      # the guard and packager refuse deliberately broken copies.
      - name: Plugin packaging self-test
        run: bash scripts/release/test-plugin-release.sh

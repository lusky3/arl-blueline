name: Release

# Push a tag vX.Y.Z (final) or vX.Y.Z-rc.N (pre-release) to publish a Blueline
# release: guard -> build -> sign -> publish. The release carries
# blueline-X.Y.Z.zip (a clean blueline/ theme folder), manifest.json (sha256 +
# requirements) and, once the RELEASE_SIGNING_KEY secret is set,
# manifest.json.sig (ed25519 over manifest.json), which the theme's own
# updater (inc/updater.php) reads. Procedure and owner steps: docs/RELEASING.md.
#
# The release also carries blueline-core-<plugin version>.zip (+ .sha256), the
# companion plugin built by scripts/release/package-plugin.sh. The plugin has
# its own version line (its header Version, not the theme tag) and no updater:
# production installs it by hand from this zip (docs/RELEASING.md, "Plugin").
#
# Packaging happens in the read-only `build` job; only `publish` holds
# contents: write, and it runs nothing but `gh release create`.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none

      # Tag must equal style.css Version and BLUELINE_VERSION, and CHANGELOG.md
      # must carry a section for it. Publishes nothing, so a mislabelled tag
      # never produces a zip.
      - name: Check the tag against the theme
        run: php scripts/release/guard.php "$GITHUB_REF_NAME"

      # The plugin's version sources must agree with each other (header, constant,
      # composer.json, readme). It is versioned independently of the tag, so the
      # tag is not compared; a drifting BLUELINE_CORE_VERSION would otherwise ship
      # a zip whose one-time rewrite flush never re-fires after an upgrade.
      - name: Check the plugin's version sources
        run: php scripts/release/plugin-guard.php

  build:
    needs: guard
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install PHP dependencies
        working-directory: themes/blueline
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        working-directory: themes/blueline
        run: npm ci

      - name: Build assets
        working-directory: themes/blueline
        run: npm run build

      - name: Run the gate
        working-directory: themes/blueline
        run: npm run check

      - name: Package the theme
        run: |
          mkdir dist
          scripts/release/package.sh "$GITHUB_REF_NAME" dist
          php scripts/release/build-manifest.php "$GITHUB_REF_NAME" "dist/blueline-${GITHUB_REF_NAME#v}.zip" dist
          cat dist/manifest.json

      # The plugin's suite needs the theme checkout's WordPress stubs, not its vendor/.
      - name: Install plugin PHP dependencies
        working-directory: plugins/blueline-core
        run: composer install --no-interaction --no-progress

      - name: Plugin tests
        working-directory: plugins/blueline-core
        run: composer test

      # Reproducible zip: .distignore applied by rsync, `composer install --no-dev`
      # only if the plugin ever declares runtime dependencies, content list asserted
      # inside the script, plus a .sha256 beside it.
      - name: Package the plugin
        run: |
          plugin_zip="$(bash scripts/release/package-plugin.sh dist | tail -n 1)"
          plugin_file="$(basename "$plugin_zip")"
          {
            echo
            echo "---"
            echo "Includes the companion plugin: \`$plugin_file\` (sha256 in \`$plugin_file.sha256\`)."
            echo "Install it first on a new site; see docs/RELEASING.md, section Plugin."
          } >> dist/notes.md
          ls -l dist

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  # Signs manifest.json (ed25519, manifest.json.sig) and proves the pair
  # verifies with the theme's own check and BLUELINE_RELEASE_PUBLIC_KEYS before
  # anything is published. Its own job so the signing key never shares a runner
  # with npm/composer installs or the build. No dependencies are installed here.
  # The key comes from the RELEASE_SIGNING_KEY secret (docs/RELEASING.md,
  # "Release signing"); while it is unset the release is published unsigned
  # with a warning, unless the theme already trusts a key, in which case
  # verify-manifest.php fails the run instead.
  sign:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      # Secrets cannot be read in `if:`; this exposes only whether one is set.
      HAS_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: sodium
          tools: none
          coverage: none

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      # The key reaches this one step only, through its environment; the
      # script never takes it as an argument and never prints it.
      - name: Sign the manifest
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: php scripts/release/sign-manifest.php dist/manifest.json

      # Uses themes/blueline/inc/updater-rules.php itself: the same function and
      # key list every site runs. Fails if the theme trusts a key and the pair
      # does not verify (or there is no signature); otherwise annotates the run
      # with a ::warning:: when the release goes out unsigned.
      - name: Verify the signature with the theme's keys
        run: php scripts/release/verify-manifest.php dist/manifest.json

      - name: Upload signed release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: dist/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist

      # A tag with a "-" suffix (v1.2.0-rc.1) is a pre-release: the beta
      # channel sees it, the stable channel does not. The release body is the
      # tag's CHANGELOG section, which is what the wp-admin update links to.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          signature=()
          if [[ -f dist/manifest.json.sig ]]; then
            signature+=(dist/manifest.json.sig)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${flags[@]}" \
            --verify-tag \
            --title "Blueline ${GITHUB_REF_NAME#v}" \
            --notes-file dist/notes.md \
            "dist/blueline-${GITHUB_REF_NAME#v}.zip" \
            dist/manifest.json \
            "${signature[@]}" \
            dist/blueline-core-*.zip \
            dist/blueline-core-*.zip.sha256
